[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ave-light-renderer"
version = "0.2.0"
description = "Deterministic offline four-region light renderer for AVE Generator"
requires-python = ">=3.11"
dependencies = [
  "imageio==2.37.3",
  "imageio-ffmpeg==0.6.0",
  "jsonschema==4.25.1",
  "numpy==2.4.4",
  "pillow==12.2.0",
  "scipy==1.17.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
ave-light-renderer = "ave_light_renderer.cli:main"
ave-audio-generator = "ave_audio_generator.cli:main"
ave-demo-generator = "ave_demo_generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["ave_light_renderer", "ave_audio_generator", "ave_demo_generator"]
